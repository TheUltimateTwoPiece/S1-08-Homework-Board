name: CI

on:
  push:
    branches: [main, Hemanth]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: HTML entity check
        run: npm run test:entities

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
